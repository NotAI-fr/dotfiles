[now-playing]
appname = "Now Playing"

# Larger title and artist text.
format = "<span size='x-large' weight='bold'>%s</span>\n<span size='large'>%b</span>"

# Larger square cover artwork.
icon_position = left
min_icon_size = 112
max_icon_size = 112

alignment = left
timeout = 5s
history_ignore = true
