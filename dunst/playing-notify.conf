[global]
    # Polybar [bar/main]: 30pt height + 2pt bottom border.
    # At 96 DPI this is about 43px; 8px gap => 51px from screen top.
    monitor = 0
    follow = none
    origin = top-center
    offset = 0x51

    width = 440
    height = 180
    alignment = left
    vertical_alignment = center

    font = "JetBrainsMono Nerd Font 11"
    format = "<b>%s</b>\n%b"
    markup = full

    icon_position = left
    max_icon_size = 96
    icon_corner_radius = 8
    text_icon_padding = 12

    padding = 10
    horizontal_padding = 12
    frame_width = 2
    corner_radius = 12
    gap_size = 0

    notification_limit = 1
    indicate_hidden = false
    sort = update
    stack_duplicates = false
    show_age_threshold = -1
    history_length = 10

[urgency_low]
    timeout = 5

[urgency_normal]
    timeout = 5

[urgency_critical]
    timeout = 5
