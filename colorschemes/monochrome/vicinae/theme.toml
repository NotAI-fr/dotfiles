[meta]
version = 1
name = "System — Monochrome"
description = "Matches the active desktop colorscheme."
variant = "dark"
inherits = "vicinae-dark"

[colors.core]
background = "#202020"
secondary_background = "#2A2A2A"
foreground = "#D0D0D0"
border = "#505050"
accent = "#B8B8B8"
accent_foreground = "#202020"

[colors.main_window]
border = "#505050"
[colors.main_window.footer]
background = "#2A2A2A"
[colors.settings_window]
border = "#505050"
[colors.shortcut]
border = "#B8B8B8"
[colors.accents]
red = "#AC4142"
orange = "#D28445"
yellow = "#E5B566"
green = "#7E8D50"
cyan = "#7DD5CF"
blue = "#6C99BA"
magenta = "#9E4E85"
purple = "#8F6F9F"
[colors.text]
default = "#D0D0D0"
muted = "#888888"
danger = "#AC4142"
success = "#7E8D50"
placeholder = "#888888"
[colors.text.links]
default = "#6C99BA"
visited = "#8F6F9F"
[colors.text.selection]
background = "#D0D0D0"
foreground = "#202020"
[colors.input]
background = "#2A2A2A"
border = "#505050"
border_focus = "#B8B8B8"
border_error = "#AC4142"
[colors.button.primary]
background = "#B8B8B8"
foreground = "#202020"
[colors.button.primary.hover]
background = "#D0D0D0"
foreground = "#202020"
[colors.button.primary.focus]
outline = "#B8B8B8"
[colors.list.item.hover]
background = "#303030"
foreground = "#D0D0D0"
secondary_foreground = "#888888"
[colors.list.item.selection]
background = "#D0D0D0"
foreground = "#202020"
secondary_background = "#D0D0D0"
secondary_foreground = "#202020"
[colors.grid.item]
background = "#2A2A2A"
[colors.grid.item.selection]
outline = "#B8B8B8"
[colors.grid.item.hover]
outline = "#505050"
[colors.scrollbars]
background = "#B8B8B8"
secondary_background = "#505050"
[colors.tooltip]
background = "#2A2A2A"
foreground = "#D0D0D0"
border = "#505050"
[colors.loading]
bar = "#B8B8B8"
spinner = "#B8B8B8"
