backend = "glx";
vsync = true;
shadow = false;
fading = false;
blur-background = false;

# ==========================================
#  CORNER ROUNDING SYSTEM
# ==========================================
corner-radius = 10;

# Vanilla picom strict keyword matching array
rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "class_g = 'Polybar'",
    "class_g = 'polybar'"
];

round-borders = 1;
