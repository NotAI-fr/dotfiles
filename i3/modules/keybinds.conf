# ==========================================
#  WORKSPACE CONFIGURATION
# ==========================================
set $ws1 "1"
set $ws2 "2"
set $ws3 "3"
set $ws4 "4"
set $ws5 "5"

# Switch to workspace
bindsym $mod+1 workspace number $ws1
bindsym $mod+2 workspace number $ws2
bindsym $mod+3 workspace number $ws3
bindsym $mod+4 workspace number $ws4
bindsym $mod+5 workspace number $ws5

# Move focused container to workspace
bindsym $mod+Shift+1 move container to workspace number $ws1
bindsym $mod+Shift+2 move container to workspace number $ws2
bindsym $mod+Shift+3 move container to workspace number $ws3
bindsym $mod+Shift+4 move container to workspace number $ws4
bindsym $mod+Shift+5 move container to workspace number $ws5


# ==========================================
#  CORE WINDOW MANAGER CONTROLS
# ==========================================
bindsym $mod+c       kill
bindsym $mod+Shift+r exec --no-startup-id polybar-msg cmd restart, restart
bindsym $mod+Shift+e exec "i3-nagbar -t warning -m 'Exit i3?' -B 'Yes' 'i3-msg exit'"


# ==========================================
#  WINDOW WORKFLOW & ORIENTATION
# ==========================================

# Toggle Fullscreen / Floating styles
bindsym $mod+f       fullscreen toggle
bindsym $mod+Shift+f floating toggle

# Swap focus between tiling and floating layers
bindsym $mod+d focus mode_toggle


# ==========================================
#  WINDOW POSITIONING & SWAPPING
# ==========================================

# Move/swap containers within the layout grid (Arrow keys)
bindsym $mod+Shift+Left  move left
bindsym $mod+Shift+Down  move down
bindsym $mod+Shift+Up    move up
bindsym $mod+Shift+Right move right


# ==========================================
#  THE SCRATCHPAD TRAY
# ==========================================
# Send an active window down to the hidden tray
bindsym $mod+Shift+minus move scratchpad

# Pull down / cycle through hidden scratchpad windows
bindsym $mod+minus scratchpad show


# ==========================================
#  CORE APPLICATION LAUNCHERS
# ==========================================
bindsym $mod+q exec kitty
bindsym $mod+e exec nemo
bindsym $mod+r exec helium-browser
bindsym $mod+l exec betterlockscreen -l blur


# ==========================================
#  ROFI & UTILITY MENUS
# ==========================================
bindsym $mod+space exec --no-startup-id rofi -show drun
bindsym $mod+w     exec --no-startup-id ~/.config/rofi/wallpaper-picker.sh
bindsym $mod+p     exec --no-startup-id ~/.config/rofi/power-menu.sh
bindsym $mod+a     exec --no-startup-id curd -rofi
bindsym $mod+t     exec --no-startup-id ~/.config/rofi/system-switcher.sh
bindsym $mod+b     exec --no-startup-id ~/.config/rofi/rofi-bluetooth.sh
bindsym $mod+x     exec --no-startup-id rofi -show calc -modi calc -no-show-match -no-sort
bindsym $mod+n     exec --no-startup-id ~/.config/rofi/scratchpad.sh
bindsym $mod+shift+p     exec --no-startup-id ~/.config/rofi/rofi-record.sh
#bindsym $mod+v     exec --no-startup-id ~/.config/rofi/rofi-web-search.sh
bindsym $mod+shift+c     exec --no-startup-id ~/.config/rofi/config-menu.sh


# Screenshot Utility
bindsym $mod+s      exec --no-startup-id maim -s | tee ~/Pictures/screenshots/$(date +%Y-%m-%d_%H%M%S).png | xclip -selection clipboard -t image/png





# ==========================================
# 60% Keyboard Brightness OSD (Mod + Ctrl + A/D)
# ==========================================
# A = Dim Monitor
bindsym $mod+Shift+a exec --no-startup-id ~/.config/i3/scripts/brightness-down.sh

# D = Brighten Monitor
bindsym $mod+Shift+d exec --no-startup-id ~/.config/i3/scripts/brightness-up.sh



# ==========================================
# Keyboard Multimedia Keys
# ==========================================


# Volume Control with a custom hard limit (1.0 = 100%)
bindsym XF86AudioRaiseVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ --limit 1.5
bindsym XF86AudioLowerVolume exec --no-startup-id wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym XF86AudioMute exec --no-startup-id wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# Music/Video Playback Control
bindsym XF86AudioPlay        exec --no-startup-id playerctl play-pause
bindsym XF86AudioNext        exec --no-startup-id playerctl next
bindsym XF86AudioPrev        exec --no-startup-id playerctl previous
