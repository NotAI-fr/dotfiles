# ~/.config/hypr/hyprlock.conf

# --- BACKGROUND ---
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    color = rgba(15, 15, 15, 0.6)
}

# --- WEATHER ---
label {
    monitor =
    text = cmd[update:3600000] ~/.config/hypr/scripts/weather.sh
    color = rgb(240, 240, 240)
    font_size = 16
    font_family = monospace
    position = 0, 280
    halign = center
    valign = center
}

# --- TIME ---
label {
    monitor =
    text = $TIME
    color = rgb(240, 240, 240)
    font_size = 100
    font_family = monospace
    position = 0, 160
    halign = center
    valign = center
}

# --- DATE ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = rgb(180, 180, 180)
    font_size = 22
    font_family = monospace
    position = 0, 60
    halign = center
    valign = center
}

# --- INPUT FIELD (Locked Permanent) ---
input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.15
    dots_center = true
    outer_color = rgb(240, 240, 240)
    inner_color = rgb(15, 15, 15)
    font_color = rgb(240, 240, 240)
    fade_on_empty = false
    fade_timeout = 0
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    rounding = -1
    position = 0, -60
    halign = center
    valign = center
}

# --- MEDIA CONTROLS ---
label {
    monitor =
    text = cmd[update:2000] ~/.config/hypr/scripts/media.sh
    color = rgb(200, 200, 200)
    font_size = 14
    font_family = monospace
    position = 0, -150
    halign = center
    valign = center
}
