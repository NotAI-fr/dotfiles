[bar/main]
width = 100%
; Height bumped to 28pt so the size 20 caps fit perfectly with the 8pt top border
height = 28pt

;bar rounding
radius = 0

;floating look
border-top-size = 5pt
border-color = #00000000

;bar padding left/right
padding-left = 2
padding-right = 2

; Fully transparent bar background so the modules float
background = #00000000
foreground = ${colors.fg}

; Exact pixel margins for a perfect gap between islands
module-margin-left = 8px
module-margin-right = 8px

; JetBrains Mono Nerd Font configuration
font-0 = JetBrainsMono Nerd Font:style=Regular:size=13;3
; Font size updated to 20 to eliminate the top/bottom bumps
font-1 = JetBrainsMono Nerd Font:style=Regular:size=20;5

; Clean, modular layout list using your custom workspaces-fi script
modules-left   = workspaces-fi weather-fi systray-fi
modules-center = date-fi player-controls-fi
modules-right  = psn-fi audio-fi bluetooth-fi power-fi

;enable ipc calls
enable-ipc = true
