;==========================================================
; FIXED MONOCHROME BRUTALIST POLYBAR CONFIG
;==========================================================

[colors]
bg = #000000
fg = #ffffff
alt = #555555

[bar/main]
width = 100%
height = 22pt
radius = 0
border-size = 2pt
border-color = #ffffff
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 1
padding-right = 1
module-margin = 1

font-0 = "monospace:size=10;2"

# Swapped out 'i3' module for our custom 'workspaces' module
modules-left   = workspaces player weather
modules-center = date
modules-right  = nightlight bluetooth wifi audio cpu ram power

# Force application-wide pointer click zones
cursor-click = pointer
enable-ipc = true

;==========================================================
; MODULES
;==========================================================

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
tail = true

[module/player]
type = custom/script
exec = playerctl metadata --format '{{ title }}' 2>/dev/null || echo "---"
interval = 2
format-prefix = ""
click-left = ~/.config/rofi/media-menu.sh &

[module/weather]
type = custom/script
exec = curl -s "wttr.in/Crewe?format=%t" | head -n 1
interval = 900
format-prefix = ""

[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d %H:%M:%S
label = %date%

[module/nightlight]
type = custom/script
exec = pgrep redshift >/dev/null && echo "NIGHT: ON" || echo "NIGHT: OFF"
interval = 2
# Left-click turns it on, Right-click kills it instantly
click-left = redshift -O 3500k &
click-right = redshift -x

[module/bluetooth]
type = custom/text
format = "BLUE"
click-left = ~/.config/rofi/bluetooth-menu.sh &

[module/wifi]
type = custom/script
# Queries nmcli directly for the currently active network name, falls back to "NO WIFI"
exec = nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 || echo "NO WIFI"
interval = 5
format-prefix = "WIFI: "
# Standard left-click drops straight into your brand new menu script
click-left = ~/.config/rofi/wifi-menu.sh &

# X11 action wrapper syntax forcing pointer interaction and calling Kitty terminal
format-connected = <label-connected>
label-connected = "%{A1:kitty -e nmtui &:}WIFI%{A}"

format-disconnected = <label-disconnected>
label-disconnected = "%{A1:kitty -e nmtui &:}NO WIFI%{A}"

[module/audio]
type = internal/pulseaudio
format-volume = VOL <label-volume>
label-muted = "MUTED"
click-right = pavucontrol &

[module/cpu]
type = internal/cpu
interval = 2
label = CPU %percentage%%

[module/ram]
type = internal/memory
interval = 2
label = RAM %percentage_used%%

[module/power]
type = custom/text
format = "EXIT"
click-left = ~/.config/rofi/power-menu.sh &
