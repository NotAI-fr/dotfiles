;==========================================================
; FIXED MONOCHROME BRUTALIST POLYBAR CONFIG
;==========================================================

include-file = colors.ini
[bar/main]
width = 100%
height = 26pt
radius = 0
border-size = 1pt
border-color = ${colors.border}
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 2
padding-right = 2
module-margin = 1
underline-size = 3
underline-color = ${colors.alt}

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=15;4"

separator = |
separator-foreground = ${colors.alt}

modules-left = workspaces weather date systray
modules-center = player-mpris
modules-right = nightlight bluetooth audio cpu temperature ram battery xfce-notif power

cursor-click = pointer
enable-ipc = true

;==========================================================
; MODULES
;==========================================================

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
tail = true

[module/prev]
type = custom/text
format = 󰒮
click-left = playerctl previous
content-padding = 1

[module/systray]
type = internal/tray
tray-spacing = 8pt
tray-size = 60%
tray-background = ${colors.bg}

[module/playpause]
type = custom/script
exec = playerctl status 2>/dev/null | grep -q Playing && echo "󰏤" || echo "󰐊"
interval = 1
click-left = playerctl play-pause

[module/next]
type = custom/text
format = 󰒭
click-left = playerctl next
content-padding = 1

[module/player]
type = custom/script
exec = playerctl metadata --format '󰎆 {{ artist }} - {{ title }}' 2>/dev/null || echo "---"
interval = 1

[module/date]
type = internal/date
interval = 1
date = %a %d %b %H:%M
format = 󰃭 <label>
label = %date%

[module/nightlight]
type = custom/script
exec = pgrep redshift >/dev/null && echo "󰖔" || echo "󰖔"
interval = 2
click-left = redshift -O 3500k &
click-right = redshift -x

[module/bluetooth]
type = custom/text
format = "󰂯"
click-left = overskride

[module/audio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
format-muted = 󰖁
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
click-right = pavucontrol &

[module/cpu]
type = internal/cpu
interval = 2
format = 󰍛 <label>
label = %percentage%%

[module/ram]
type = internal/memory
interval = 2
format =  <label>
label = %percentage_used%%

[module/power]
type = custom/text
format = "󰐥"
click-left = ~/.config/rofi/power-menu.sh &

[module/xfce-notif]
type = custom/text
format = ""
click-left = xfce4-notifyd-config &

[module/weather]
type = custom/script
exec = echo " $(curl -s 'wttr.in/Crewe?format=%t')"
interval = 1800
click-left = kitty --class weather_tui -e ~/.config/polybar/weather-tui.sh &

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80
format = 󰔏 <label>
format-foreground = ${colors.fg}
label = %temperature-c%
format-warn = 󰸁 <label-warn>
format-warn-foreground = #FF5555
format-warn-underline = #FF5555
label-warn = %temperature-c%

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5
format-charging = 󱐋 <label-charging>
format-discharging = 󰁹 <label-discharging>
format-full = 󰁹 <label-full>
label-charging = %percentage%%
label-discharging = %percentage%%
label-full = %percentage%%
format-low = 󰂃 <label-low>
format-low-foreground = #FF5555
format-low-underline = #FF5555
label-low = %percentage%%

[module/player-mpris]
type = custom/script
exec = ~/.config/polybar/player-mpris.py -f '{icon} {artist} - {title}' --icon-playing "󰐊" --icon-paused "󰏤" --icon-stopped "󰓛"
tail = true
click-left = ~/.config/polybar/player-mpris.py previous &
click-right = ~/.config/polybar/player-mpris.py next &
click-middle = ~/.config/polybar/player-mpris.py play-pause &
