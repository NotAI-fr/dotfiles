;==========================================================
; FIXED MONOCHROME BRUTALIST POLYBAR CONFIG
;==========================================================

[colors]
bg = #90000000
fg = #D3D3D3
alt = #555555

[bar/main]
width = 100%
height = 26pt
radius = 0
border-size = 1pt
border-color = #D3D3D3
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 2
padding-right = 2
module-margin = 1
underline-size = 3
underline-color = #D3D3D3

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=15;4"

separator = |
separator-foreground = #D3D3D3

modules-left = workspaces weather date systray
modules-center = prev playpause next player
modules-right = nightlight bluetooth wifi audio cpu ram xfce-notif power

# Force application-wide pointer click zones
cursor-click = pointer
enable-ipc = true

;==========================================================
; MODULES
;==========================================================

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
tail = true

[module/prev]
type = custom/text

format = 󰒮

click-left = playerctl previous

content-padding = 1

[module/systray]
type = internal/tray
tray-spacing = 8pt
tray-size = 60%
tray-background = ${colors.bg}

[module/playpause]
type = custom/script

exec = playerctl status 2>/dev/null | grep -q Playing && echo "󰏤" || echo "󰐊"

interval = 1

click-left = playerctl play-pause

[module/next]
type = custom/text

format = 󰒭

click-left = playerctl next

content-padding = 1

[module/player]
type = custom/script
# Note the addition of the icon inside the quotes before the format
exec = playerctl metadata --format '󰎆 {{ artist }} - {{ title }}' 2>/dev/null || echo "---"
interval = 1


[module/date]
type = internal/date
interval = 1

date = %a %d %b %H:%M

format = 󰃭 <label>
label = %date%

[module/nightlight]
type = custom/script
exec = pgrep redshift >/dev/null && echo "󰖔" || echo "󰖔"
interval = 2

click-left = redshift -O 3500k &
click-right = redshift -x

[module/bluetooth]
type = custom/text
format = "󰂯"
click-left = kitty --class=floating_tool -e bluetui &

[module/wifi]
type = custom/text
format = "󰤨"
click-left = kitty --class=floating_tool -e impala &

[module/audio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

format-muted = 󰖁

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾

click-right = pavucontrol &

[module/cpu]
type = internal/cpu
interval = 2

format = 󰍛 <label>
label = %percentage%%

[module/ram]
type = internal/memory
interval = 2

format =  <label>
label = %percentage_used%%

[module/power]
type = custom/text

format = "󰐥"

click-left = ~/.config/rofi/power-menu.sh &


[module/xfce-notif]
type = custom/text
format = ""
click-left = xfce4-notifyd-config &

[module/weather]
type = custom/script
# Lightweight curl for the bar text (fetches a tiny summary every 30 mins)
exec = echo " $(curl -s 'wttr.in/Crewe?format=%t')"
interval = 1800

# Launch your terminal with the designated i3 instance name.
# (Adjust 'alacritty' to kitty or urxvt if needed)
click-left = kitty --class alacritty,weather_tui -e ~/.config/polybar/weather-tui.sh &
