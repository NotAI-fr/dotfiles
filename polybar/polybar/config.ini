;==========================================================
; FIXED MONOCHROME BRUTALIST POLYBAR CONFIG
;==========================================================

[colors]
bg = #cc000000
fg = #ffffff
alt = #555555

[bar/main]
width = 100%
height = 26pt
radius = 0
border-size = 2pt
border-color = #ffffff
background = ${colors.bg}
foreground = ${colors.fg}
padding-left = 1
padding-right = 1
module-margin = 1
underline-size = 3
underline-color = #ffffff

font-0 = "JetBrainsMono Nerd Font:style=Bold:size=11;3"
font-1 = "JetBrainsMono Nerd Font:style=Bold:size=15;4"

separator = |
separator-foreground = #ffffff

modules-left = workspaces weather systray
modules-center = prev playpause next player
modules-right = nightlight bluetooth wifi audio cpu ram date notifications power

# Force application-wide pointer click zones
cursor-click = pointer
enable-ipc = true

;==========================================================
; MODULES
;==========================================================

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
tail = true

[module/prev]
type = custom/text

content = 󰒮

click-left = playerctl previous

content-padding = 1

[module/systray]
type = internal/tray
tray-spacing = 8pt
tray-size = 60%
tray-background = ${colors.bg}

[module/playpause]
type = custom/script

exec = playerctl status 2>/dev/null | grep -q Playing && echo "󰏤" || echo "󰐊"

interval = 1

click-left = playerctl play-pause

[module/next]
type = custom/text

content = 󰒭

click-left = playerctl next

content-padding = 1

[module/player]
type = custom/script
# Note the addition of the icon inside the quotes before the format
exec = playerctl metadata --format '󰎆 {{ title }}' 2>/dev/null || echo "---"
interval = 1

[module/weather]
type = custom/script
exec = echo " $(curl -s 'wttr.in/Crewe?format=%t')"
interval = 900

[module/date]
type = internal/date
interval = 1

date = %H:%M

format = 󰃭 <label>
label = %date%

[module/nightlight]
type = custom/script
exec = pgrep redshift >/dev/null && echo "󰖔" || echo "󰖔"
interval = 2

click-left = redshift -O 3500k &
click-right = redshift -x

[module/bluetooth]
type = custom/text
format = "󰂯"
click-left = kitty --class=floating_tool -e bluetui &

[module/wifi]
type = custom/script
exec = nmcli -t -f active,ssid dev wifi | grep '^yes' | cut -d: -f2 || echo "OFF"
interval = 5
format-prefix = "󰤨 "
click-left = kitty --class=floating_tool -e impala &

[module/audio]
type = internal/pulseaudio

format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%

format-muted = 󰖁

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾

click-right = pavucontrol &

[module/cpu]
type = internal/cpu
interval = 2

format = 󰍛 <label>
label = %percentage%%

[module/ram]
type = internal/memory
interval = 2

format =  <label>
label = %percentage_used%%

[module/power]
type = custom/text

format = "󰐥"

click-left = ~/.config/rofi/power-menu.sh &


[module/notifications]
type = custom/text
format = "󰂚"
# Sending USR1 tells the daemon to instantly slide the side panel out or in
click-left = kill -s USR1 $(pidof deadd-notification-center) &
