;==========================================================
; MODULES
;==========================================================

[module/workspaces]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
tail = true

[module/systray]
type = internal/tray
tray-spacing = 8pt
tray-size = 60%
tray-background = ${colors.bg}

[module/date]
type = internal/date
interval = 1
date = %a %d %b %H:%M
format = 󰃭 <label>
label = %date%
format-foreground = ${colors.alt}
label-foreground = ${colors.fg}

[module/nightlight]
type = custom/script
exec = pgrep redshift >/dev/null && echo "󰖔" || echo "󰖔"
interval = 2
click-left = redshift -O 3500k &
click-right = redshift -x
format-foreground = ${colors.alt}

[module/bluetooth]
type = custom/text
format = "󰂯"
click-left = ~/.config/rofi/rofi-bluetooth.sh &
format-foreground = ${colors.alt}

[module/audio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
format-muted = 󰖁
format-muted-foreground = ${colors.alt}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
ramp-volume-foreground = ${colors.alt}
click-right = pavucontrol &

[module/cpu]
type = internal/cpu
interval = 2
format = 󰍛 <label>
format-foreground = ${colors.alt}
label = %percentage%%
label-foreground = ${colors.fg}

[module/ram]
type = internal/memory
interval = 2
format =  <label>
format-foreground = ${colors.alt}
label = %percentage_used%%
label-foreground = ${colors.fg}

[module/power]
type = custom/text
format = "󰐥"
click-left = ~/.config/rofi/power-menu.sh &
format-foreground = ${colors.alt}

[module/notif]
type = custom/script
exec = ~/.config/polybar/dunst-status.sh &
interval = 1
format-foreground = ${colors.alt}

# Left click: Toggle Do Not Disturb
click-left = dunstctl set-paused toggle

# Middle click: Instantly dismiss all notifications currently on screen
click-middle = dunstctl close-all

# Right click: Clear all history (marks everything as read)
click-right = dunstctl history-clear

# Scroll Up/Down: Pop missed notifications from history back onto your screen
scroll-up = dunstctl history-pop
scroll-down = dunstctl history-pop

[module/weather]
type = custom/script
exec = curl -s 'wttr.in/Crewe?format=%t'
interval = 900
enable-ipc = true
click-left = kitty --class weather_tui -e ~/.config/polybar/weather-tui.sh &
click-right = polybar-msg action "#weather.exec"
format-prefix = " "
format-prefix-foreground = ${colors.alt}
label-foreground = ${colors.fg}

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80
format = 󰔏 <label>
format-foreground = ${colors.alt}
label = %temperature-c%
label-foreground = ${colors.fg}
format-warn = 󰸁 <label-warn>
format-warn-foreground = #FF5555
format-warn-underline = #FF5555
label-warn = %temperature-c%

[module/battery]
type = internal/battery
full-at = 99
low-at = 15
battery = BAT0
adapter = AC
poll-interval = 5
format-charging = 󱐋 <label-charging>
format-charging-foreground = ${colors.alt}
label-charging = %percentage%%
label-charging-foreground = ${colors.fg}

format-discharging = 󰁹 <label-discharging>
format-discharging-foreground = ${colors.alt}
label-discharging = %percentage%%
label-discharging-foreground = ${colors.fg}

format-full = 󰁹 <label-full>
format-full-foreground = ${colors.alt}
label-full = %percentage%%
label-full-foreground = ${colors.fg}

format-low = 󰂃 <label-low>
format-low-foreground = #FF5555
format-low-underline = #FF5555
label-low = %percentage%%

[module/player-mpris]
type = custom/script
exec = ~/.config/polybar/player-mpris.py -f '{icon} {artist} - {title}' --icon-playing "󰐊" --icon-paused "󰏤" --icon-stopped "󰓛"
tail = true
click-left = ~/.config/polybar/player-mpris.py previous &
click-right = ~/.config/polybar/player-mpris.py next &
click-middle = ~/.config/polybar/player-mpris.py play-pause &

label = %output:0:30:...%

[module/scratchpad]
type = custom/script
exec = ~/.config/polybar/polybar-scratchpad.sh
interval = 5
format-padding = 1
format-foreground = ${colors.fg}
click-left = ~/.config/rofi/scratchpad.sh

[module/mic]
type = custom/script
exec = pactl get-source-volume @DEFAULT_SOURCE@ | grep -Po '\\d+(?=%)' | head -n 1 | sed 's/$/%/'
interval = 1

# Mouse wheel scrolling controls
scroll-up = pactl set-source-volume @DEFAULT_SOURCE@ +5%
scroll-down = pactl set-source-volume @DEFAULT_SOURCE@ -5%

# Left click to mute/unmute
click-left = pactl set-source-mute @DEFAULT_SOURCE@ toggle

format-prefix = "󰍬 "
format-prefix-foreground = ${colors.alt}
label-foreground = ${colors.fg}


; =======================================
; MODULES (Self-Rounding & Isolated)
; =======================================

[module/workspaces-fi]
type = custom/script
exec = ~/.config/polybar/workspaces.sh
tail = true
format-background = ${colors.fi}
format = "<label>"

; Left and right embedded caps
format-prefix = ""
format-prefix-font = 2
format-prefix-foreground = ${colors.fi}
format-prefix-background = #00000000
format-suffix = ""
format-suffix-font = 2
format-suffix-foreground = ${colors.fi}
format-suffix-background = #00000000

[module/cpu-fi]
type = internal/cpu
interval = 2
format-background = ${colors.fi}

; Clean formatting
format = "   <label>"
format-foreground = ${colors.alt}

; Left and right embedded caps
format-prefix = ""
format-prefix-font = 2
format-prefix-foreground = ${colors.fi}
format-prefix-background = #00000000
format-suffix = ""
format-suffix-font = 2
format-suffix-foreground = ${colors.fi}
format-suffix-background = #00000000

label = %percentage:2%%
label-foreground = ${colors.fg}
; Adds pixel-perfect space to prevent the '%' sign from getting clipped by the right cap
label-padding-right = 1

[module/date-fi]
type = internal/date
interval = 1
format-background = ${colors.fi}

format = " 󰃭 <label>"
format-foreground = ${colors.alt}

; Left rounded cap
format-prefix = ""
format-prefix-font = 2
format-prefix-foreground = ${colors.fi}
format-prefix-background = #00000000

; Right rounded cap
format-suffix = ""
format-suffix-font = 2
format-suffix-foreground = ${colors.fi}
format-suffix-background = #00000000

date = %a %d %b %H:%M
label = %date%
label-foreground = ${colors.fg}

