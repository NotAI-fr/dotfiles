[module/audio-fi]
type = internal/pulseaudio

; Normal volume
format-volume = <ramp-volume><label-volume>
format-volume-background = ${colors.fi}
format-volume-foreground = ${colors.alt}

ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-3 = 󰕾
ramp-volume-foreground = ${colors.alt}

; Prevent wider volume icons from touching either rounded cap
ramp-volume-padding = 1
ramp-volume-font = 1

label-volume = %percentage%%
label-volume-foreground = ${colors.fg}
label-volume-padding-right = 1

; Muted state
format-muted = <label-muted>
format-muted-background = ${colors.fi}

label-muted = 󰖁
label-muted-foreground = ${colors.alt}
label-muted-font = 1

; Prevent clipping and stop the muted island becoming extremely tiny
label-muted-padding = 1
label-muted-minlen = 4
label-muted-alignment = center

click-right = pavucontrol &

; Normal volume caps
format-volume-prefix = ""
format-volume-prefix-font = 2
format-volume-prefix-foreground = ${colors.fi}
format-volume-prefix-background = #00000000

format-volume-suffix = ""
