[general]
font-sans = "Inter Nerd Font"
font-mono = "Inter Nerd Font"

[bar]
scale = 0.8500000238418579
module-gap = 0.800000011920929
bg = "transparent"
background-opacity = 77
border-location = "bottom"
border-width = 2
border-color = "transparent"
rounding = "sm"
button-variant = "basic"
button-icon-size = 1.100000023841858
button-label-padding = 1.2999999523162842
button-rounding = "md"
button-gap = 1.2999999523162842

[[bar.layout]]
monitor = "*"
show = true
left = [
    "dashboard",
    "hyprland-workspaces",
    "weather",
    "cpu",
    "ram",
    "storage",
]
center = [
    "media",
    "cava",
    "clock",
]
right = [
    "hyprsunset",
    "bluetooth",
    "network",
    "volume",
    "systray",
    "notifications",
    "power",
]

[styling.palette]
bg = "#121214"
surface = "#1a1a1e"
elevated = "#26262b"
fg = "#e1e1e6"
fg-muted = "#8b8b93"
primary = "#ffffff"
red = "#62626a"
yellow = "#a0a0a8"
green = "#bcbcc4"
blue = "#d2d2d9"

[modules.battery]
border-show = true

[modules.cava]
button-bg-color = "bg-surface"

[modules.clock]
format = "%b %d %H:%M"
icon-show = false

[modules.dashboard]
dropdown-lock-command = "hyprlock"

[modules.hyprland-workspaces]
min-workspace-count = 5
monitor-specific = false
show-special = false
container-bg-color = "bg-selected"
border-color = "fg-default"

[modules.media]
icon-type = "spinning-disc"
icon-color = "fg-subtle"
icon-bg-color = "bg-base"
label-color = "fg-default"

[modules.microphone]
icon-active = "ld-volume-symbolic"
border-show = true

[modules.power]
left-click = "wlogout"

[modules.volume]
scroll-up = "pactl set-sink-volume @DEFAULT_SINK@ +5%"
scroll-down = "pactl set-sink-volume @DEFAULT_SINK@ -5%"

[modules.weather]
provider = "visual-crossing"
location = "Crewe"
time-format = "24h"
visual-crossing-key = "NDCAEUFUSF87VPYY7AZR367U6"
icon-show = false

[wallpaper]
cycling-enabled = true
cycling-directory = "/home/nobloat/Pictures/Walls/Faves/a_street_lights_at_night_01.jpg"
cycling-same-image = true
